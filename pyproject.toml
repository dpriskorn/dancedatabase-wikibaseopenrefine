[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "dancedb-reconcile"
version = "0.1.0"
description = "DanceDB Reconciliation Service"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
redis = {extras = ["hiredis"], version = ">=5.0.0"}
aiohttp = ">=3.8.0"
aiodns = ">=3.0.0"
aioresponses = ">=0.7.2"
asynctest = ">=0.13.0"
pytest = ">=6.2.5"
pytest-mock = ">=3.6.1"
pytest-asyncio = ">=0.16.0"
quart = ">=0.14.1"
hypercorn = ">=0.11.2"
typing-extensions = ">=4.0.1"
quart-cors = ">=0.5.0"
docopt = ">=0.6.2"
fuzzywuzzy = ">=0.18.0"
python-Levenshtein = ">=0.12.2"
unidecode = ">=1.3.2"
funcparserlib = ">=0.3.6"
python-dateutil = ">=2.8.2"
jinja2 = ">=3.0.3"

[tool.poetry.group.dev.dependencies]
pytest = ">=6.2.5"
pytest-mock = ">=3.6.1"
pytest-asyncio = ">=0.16.0"
asynctest = ">=0.13.0"
